        data=private/'data'
        with (private/'bootstrap.private.log').open('xb') as log:
            subprocess.run([str(pg/'initdb'),'-D',str(data),'-U','metodobase_test_admin','--no-locale','--encoding=UTF8',
                '--auth-local=trust','--auth-host=scram-sha-256','--pwfile='+str(private/'initdb-password.private')],check=True,stdout=log,stderr=subprocess.STDOUT)
            subprocess.run([str(pg/'pg_ctl'),'-D',str(data),'-l',str(private/'postgresql.private.log'),'-o','-h 127.0.0.1 -p 55483','-w','-t','60','start'],check=True,stdout=log,stderr=subprocess.STDOUT)
        pidfile=(data/'postmaster.pid').read_bytes();pid=int(pidfile.splitlines()[0])
        stat=Path('/proc/'+str(pid)+'/stat').read_text();birth=int(stat[stat.rindex(')')+2:].split()[19])
        assert Path('/proc/'+str(pid)+'/exe').resolve()==pg/'postgres'
        identity={'pid':pid,'start_ticks':birth,'boot_id':Path('/proc/sys/kernel/random/boot_id').read_text().strip(),
            'postmaster_pidfile_sha256':hashlib.sha256(pidfile).hexdigest(),'data':str(data),'port':55483,'source_commit':source['HEAD']}
        (private/'cluster-identity.private.json').write_text(json.dumps(identity,indent=2)+'\n',encoding='utf8')
        import psycopg2
        from psycopg2 import sql
        control=psycopg2.connect(host='127.0.0.1',port=55483,dbname='postgres',user='metodobase_test_admin',password=password)
        control.autocommit=True
        try:
            with control.cursor() as cursor:
                cursor.execute('SHOW server_version_num');assert cursor.fetchone()==('170011',)
                cursor.execute("SELECT inet_server_addr()::text,inet_server_port()")
                host,port=cursor.fetchone();assert host in {'127.0.0.1','127.0.0.1/32'} and port==55483
                cursor.execute("SELECT rolsuper,rolbypassrls,rolcreatedb,rolcreaterole FROM pg_roles WHERE rolname=current_user")
                assert cursor.fetchone()==(True,True,True,True)
                cursor.execute("CREATE ROLE metodobase_test_app LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD %s",(app_password,))
                cursor.execute(sql.SQL('CREATE DATABASE {}').format(sql.Identifier('metodobase_test_integration')))
                cursor.execute("SELECT rolsuper,rolbypassrls,rolcreatedb,rolcreaterole FROM pg_roles WHERE rolname='metodobase_test_app'")
                assert cursor.fetchone()==(False,False,False,False)
                cursor.execute("SELECT count(*) FROM pg_auth_members WHERE member=(SELECT oid FROM pg_roles WHERE rolname='metodobase_test_app')")
                assert cursor.fetchone()==(0,)
                cursor.execute("SELECT count(*) FROM pg_database WHERE datname LIKE 'metodobase_test_account37_%'");assert cursor.fetchone()==(0,)
                cursor.execute('SELECT pg_postmaster_start_time()');postmaster_start=cursor.fetchone()[0].isoformat()
        finally:control.close()
        profile=private/'profile.private.json'
        profile.write_text(json.dumps({'METODOBASE_TEST_MIGRATOR_URL':'postgresql+psycopg2://metodobase_test_admin:'+password+'@127.0.0.1:55483/metodobase_test_integration',
            'METODOBASE_TEST_POSTGRES_URL':'postgresql+psycopg2://metodobase_test_app:'+app_password+'@127.0.0.1:55483/metodobase_test_integration',
            'METODOBASE_TEST_PG_BIN':str(pg)},indent=2)+'\n',encoding='utf8')
        # This is a privileged TEST-cluster migrator, never the production-role design.
        for label,value in [('429',contract429(root,source,profile,[row['key'] for row in phases()])),('53',contract53(root,source,profile))]:
            ack={'approved':True,'scope':value['schema'],'contract_sha256':digest(value),'expires_at_UTC':(datetime.now(UTC)+timedelta(hours=4)).isoformat()}
            (private/('ack'+label+'.private.json')).write_text(json.dumps(ack,indent=2)+'\n',encoding='utf8')
            (private/('contract'+label+'.private.json')).write_text(json.dumps(value,indent=2)+'\n',encoding='utf8')
        generation=private/'generation27.private.json'
        generation.write_text(json.dumps(ci_generation(identity,postmaster_start),indent=2)+'\n',encoding='utf8')
        value=contract27(profile,generation)
        ack={'approved':True,'scope':value['schema'],'contract_sha256':digest(value),'expires_at_UTC':(datetime.now(UTC)+timedelta(hours=4)).isoformat()}
        (private/'ack27.private.json').write_text(json.dumps(ack,indent=2)+'\n',encoding='utf8')
        (private/'contract27.private.json').write_text(json.dumps(value,indent=2)+'\n',encoding='utf8')
        assert source_photo()==source
        print(json.dumps({'scope':'fresh_ephemeral_GitHub_Actions_TEST_cluster_only','profile_and_three_source_bound_ACKs_ready':True,'port':55483,'planned_UUIDs':71,'required_identities':509,'max_concurrent_UUIDs':2}))
        PY
        printf '%s\n' '{"ci37_pg_bootstrap_ready":true}'
    - name: Actual37 complete429 business and physical gates;69 UUID budget including restore
      run: python -B -X utf8 tests/ci_web37/run_postgres.py --pg-profile "$RUNNER_TEMP/ci37-pg-cluster-private/profile.private.json" --lease-ack "$RUNNER_TEMP/ci37-pg-cluster-private/ack429.private.json" --private "$RUNNER_TEMP/ci37-pg429-private" --output "$RUNNER_TEMP/ci37-pg-public/429"
    - name: Separate original53 routine and R30 PostgreSQL criteria; one UUID and pool5
