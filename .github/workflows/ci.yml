          test "$(dpkg-query -W -f='${Version}' postgresql-17)" = "$version"
          test "$(dpkg-query -W -f='${Version}' postgresql-client-17)" = "$version"
          test "$(dpkg-query -W -f='${Version}' libpq5)" = "$version"
          /usr/lib/postgresql/17/bin/postgres --version
          /usr/lib/postgresql/17/bin/pg_dump --version
