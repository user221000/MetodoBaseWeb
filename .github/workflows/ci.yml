name: CI
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  QT_QPA_PLATFORM: offscreen
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements-test-quality.txt
    - name: Undefined names block integration
      run: python tests/check_quality.py lint
    - name: Parse every maintained Python source
      run: python tests/check_quality.py syntax
    - name: Reviewed Bandit baseline; new findings block integration
      run: python tests/check_quality.py security
    - name: Real quality tools reject synthetic script and entrypoint regressions
      run: python tests/verify_quality_guards.py
  secrets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install the reviewed Gitleaks release outside the deliverable
      run: |
        mkdir -p "$RUNNER_TEMP/metodobase-gitleaks"
        curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/metodobase-gitleaks/release.tar.gz"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/metodobase-gitleaks/release.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/metodobase-gitleaks/release.tar.gz" -C "$RUNNER_TEMP/metodobase-gitleaks"
    - name: Scan the frozen deliverable tree with values withheld
      run: python -X utf8 scripts/scan_secrets.py --gitleaks "$RUNNER_TEMP/metodobase-gitleaks/gitleaks" --report "$RUNNER_TEMP/metodobase-secrets-sanitized.json"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: secret-scan-metadata
        path: ${{ runner.temp }}/metodobase-secrets-sanitized.json
  test-web:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: tests/e2e/package-lock.json
    - run: python -m pip install --require-hashes -r requirements-test.lock
    - run: npm ci --prefix tests/e2e --ignore-scripts
    - name: Create public metadata parent; each gate creates its own private boundary
      run: install -d -m 700 "$RUNNER_TEMP/web37-public"
    - name: Current37 complete web serial; exact identities, no skips and reviewed nutrition coverage
      run: python -B -X utf8 tests/ci_web37/run_web.py --suite serial --private "$RUNNER_TEMP/web37-serial-private" --output "$RUNNER_TEMP/web37-public/serial"
    - name: Current37 full web in two workers; shuffle seed20261018 and no skips
      run: python -B -X utf8 tests/ci_web37/run_web.py --suite parallel --private "$RUNNER_TEMP/web37-parallel-private" --output "$RUNNER_TEMP/web37-public/parallel"
    - name: Original physical35 assertions with authenticated ancestor35 models
      run: python -B -X utf8 tests/ci_web37/run_web.py --suite history35 --private "$RUNNER_TEMP/web37-history35-private" --output "$RUNNER_TEMP/web37-public/history35"
    - name: Literal R05 peer60, author48 and author15; frozen authenticated phases
      run: python -B -X utf8 tests/ci_web37/run_web.py --suite r05-history --private "$RUNNER_TEMP/web37-r05-history-private" --output "$RUNNER_TEMP/web37-public/r05-history"
    - name: Private storage SDK original full identities without a provider; no skips
      run: python -B -X utf8 tests/ci_web37/run_web.py --suite storage-sdk --private "$RUNNER_TEMP/web37-storage-private" --output "$RUNNER_TEMP/web37-public/storage-sdk"
    - name: Publish measured coverage without private assertion diagnostics
      if: always()
      run: python -B -X utf8 tests/ci_google33/publish.py --directory "$RUNNER_TEMP/web37-serial-private" --output "$RUNNER_TEMP/web37-public/coverage" --files coverage.json coverage.xml
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: web37-tests-${{ matrix.python }}
        path: |
          ${{ runner.temp }}/web37-public/*/summary.json
          ${{ runner.temp }}/web37-public/coverage/coverage.json
          ${{ runner.temp }}/web37-public/coverage/coverage.xml
          ${{ runner.temp }}/web37-public/coverage/publication.json
        if-no-files-found: error
  frontend-contracts:
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: tests/e2e/package-lock.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install --require-hashes -r requirements-test.lock
    - run: npm ci --prefix tests/e2e --ignore-scripts
    - name: Create public metadata parent; raw Node diagnostics remain private
      run: install -d -m 700 "$RUNNER_TEMP/web37-node-public"
    - name: Legacy51 commands with865 unique original obligations and authenticated source companions
      run: python -B -X utf8 tests/ci_web37/run_web.py --suite node --private "$RUNNER_TEMP/web37-node-legacy-private" --output "$RUNNER_TEMP/web37-node-public/legacy51"
    - name: Additional current UI27/37 thirteen programs and147 exact ordered original criteria
      run: python -B -X utf8 tests/ci_web37/run_web.py --suite node-current --private "$RUNNER_TEMP/web37-node-current-private" --output "$RUNNER_TEMP/web37-node-public/current13"
    - name: Additional eight routine/onboarding programs and94 source-bound original criteria
      run: python -B -X utf8 tests/ci_web37/run_web.py --suite node-routines-onboarding --private "$RUNNER_TEMP/web37-node-additional-private" --output "$RUNNER_TEMP/web37-node-public/routines-onboarding"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: web37-frontend-contracts
        path: ${{ runner.temp }}/web37-node-public/*/summary.json
        if-no-files-found: error
  redis:
    runs-on: ubuntu-latest
    needs: quality
    services:
      redis:
        image: redis:7.4.11-bookworm
        ports:
        - 56379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      METODOBASE_TEST_REDIS_URL: redis://127.0.0.1:56379/15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install --require-hashes -r requirements-test.lock
    - name: Atomic Lua, fixed TTL, four real workers and distributed login account limit
      run: python -X utf8 tests/run_isolated.py tests/integration_redis.py -q --tb=short --junitxml=pytest-redis.xml
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: redis-integration
        path: pytest-redis.xml
  ci-success:
    runs-on: ubuntu-latest
    needs:
    - quality
    - secrets
    - test-web
    - frontend-contracts
    - redis
    - historical-ci30
    - historical-postgres
    - historical-image
    - current-postgres
    - current-image
    - historical31-postgres
    - historical31-image
    - historical31-frontend
    - historical31-web
    - historical31-wiring
    - historical32-postgres
    if: always()
    steps:
    - name: Every required gate must succeed
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: python -c "import json,os; results=json.loads(os.environ['RESULTS']); assert all(item['result']=='success' for
        item in results.values()), results"
  historical-ci30:
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - run: python -m pip install --require-hashes -r requirements-test.lock
    - name: Unchanged full CI30 and original VM348 on authenticated ancestor30
      run: python -X utf8 tests/run_reviewed_ci30.py --history-repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/ci30-full"
        --include-vm
  historical-postgres:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: metodobase_test_admin
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: metodobase_test_integration
        ports:
        - 55482:5432
        options: --health-cmd "pg_isready -U metodobase_test_admin -d metodobase_test_integration" --health-interval 5s --health-timeout
          5s --health-retries 10
    env:
      METODOBASE_TEST_MIGRATOR_URL: postgresql+psycopg2://metodobase_test_admin:synthetic-ci-only@127.0.0.1:55482/metodobase_test_integration
      METODOBASE_TEST_POSTGRES_URL: postgresql+psycopg2://metodobase_test_app:synthetic-app-only@127.0.0.1:55482/metodobase_test_integration
      METODOBASE_TEST_PG_BIN: /usr/lib/postgresql/17/bin
      METODOBASE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/ci30-postgres-private/evidence
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Materialize exact accepted CI30 Git blobs; no archive filters or replace refs
      working-directory: ${{ github.workspace }}
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-postgres-private"
        (
        python -X utf8 tests/run_reviewed_ci30.py --materialize-only --history-repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/ci30-postgres"
        ) > "$RUNNER_TEMP/ci30-postgres-private/step-2.raw.log" 2>&1
    - name: Keep historical raw restore evidence private
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-postgres-private"
        (
        install -d -m 700 "$METODOBASE_TEST_EVIDENCE_DIR"
        ) > "$RUNNER_TEMP/ci30-postgres-private/step-3.raw.log" 2>&1
    - run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-postgres-private"
        (
        python -m pip install --require-hashes -r requirements-test.lock
        ) > "$RUNNER_TEMP/ci30-postgres-private/step-4.raw.log" 2>&1
    - name: Matching PostgreSQL client tools from the official PGDG repository
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-postgres-private"
        (
        . /etc/os-release
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl --fail --silent --show-error --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
        sudo apt-get update
