        install -d -m 700 "$RUNNER_TEMP/ci30-image-private"
        (
        export CHROME_PATH=$(node -e "process.stdout.write(require('./tests/e2e/node_modules/playwright-core').chromium.executablePath())")
        node tests/e2e/subscription.cjs
        node tests/e2e/subscription_contract_review.cjs
        node tests/e2e/gym_subscription.cjs
        node tests/e2e/responsive_accessibility.cjs
        node tests/e2e/team.cjs
        ) > "$RUNNER_TEMP/ci30-image-private/step-9.raw.log" 2>&1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Exact runtime for the separate real R11 SQLite browser fixture
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-image-private"
        (
        python -m pip install --require-hashes -r requirements-test.lock
        ) > "$RUNNER_TEMP/ci30-image-private/step-11.raw.log" 2>&1
    - name: Real team authentication and API with an isolated Clinic fixture
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-image-private"
        (
        export CHROME_PATH=$(node -e "process.stdout.write(require('./tests/e2e/node_modules/playwright-core').chromium.executablePath())")
        export METODOBASE_E2E_URL=http://127.0.0.1:8767
        python -X utf8 tests/e2e/team_fullstack_server.py > docs/implementation/20261018-evolution/evidence/ux/ci-team-fullstack-server.log 2>&1 &
        team_fixture_pid=$!
        trap 'kill "$team_fixture_pid" 2>/dev/null || true' EXIT
        ready=0
        for attempt in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:8767/health/ready; then ready=1; break; fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          cat docs/implementation/20261018-evolution/evidence/ux/ci-team-fullstack-server.log
          exit 1
        fi
        node tests/e2e/team_fullstack.cjs
        ) > "$RUNNER_TEMP/ci30-image-private/step-12.raw.log" 2>&1
    - name: Generation, private branding, export and refresh with separate real synthetic fixtures
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-image-private"
        (
        export CHROME_PATH=$(node -e "process.stdout.write(require('./tests/e2e/node_modules/playwright-core').chromium.executablePath())")
        export METODOBASE_EVIDENCE_BATCH="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        browser_fixture_pid=''
        trap 'if [ -n "${browser_fixture_pid:-}" ]; then kill "$browser_fixture_pid" 2>/dev/null || true; fi' EXIT
        run_browser_fixture() {
          local fixture_script="$1" fixture_port="$2" driver="$3" expected_report="$4" minimum_checks="$5"
          local report_format="${6:-strings}" minimum_screens="${7:-0}"
          local second_driver="${8:-}" second_report="${9:-}" second_minimum="${10:-0}"
          local second_format="${11:-strings}" second_screens="${12:-0}" ready_marker="${13:-}"
          local fixture_log="docs/implementation/20261018-evolution/evidence/ux/ci-${fixture_port}-${driver##*/}-server.log"
          export METODOBASE_E2E_URL="http://127.0.0.1:${fixture_port}"
          python -X utf8 "$fixture_script" > "$fixture_log" 2>&1 &
          browser_fixture_pid=$!
          local ready=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$browser_fixture_pid" 2>/dev/null; then cat "$fixture_log"; return 1; fi
            if curl --fail --silent "${METODOBASE_E2E_URL}/health/ready"; then
              if [ -z "$ready_marker" ] || python scripts/check_browser_fixture_startup.py "$fixture_log" --fixture "$ready_marker" --tables 29 --revision 20261019_personal_history_index 2>/dev/null; then ready=1; break; fi
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "$fixture_log"; return 1; fi
          kill -0 "$browser_fixture_pid" || return 1
          node "$driver" || return $?
          python scripts/check_frontend_report.py "$expected_report" --format "$report_format" --minimum "$minimum_checks" --minimum-screens "$minimum_screens" || return $?
          if [ -n "$second_driver" ]; then
            kill -0 "$browser_fixture_pid" || return 1
            node "$second_driver" || return $?
            python scripts/check_frontend_report.py "$second_report" --format "$second_format" --minimum "$second_minimum" --minimum-screens "$second_screens" || return $?
          fi
          kill "$browser_fixture_pid"
          wait "$browser_fixture_pid" || true
          browser_fixture_pid=''
        }
        browser_evidence=docs/implementation/20261018-evolution/evidence/ux
        run_browser_fixture tests/e2e/gym_generation_server.py 8769 tests/e2e/gym_generation.cjs "${browser_evidence}/b2b-generation-${METODOBASE_EVIDENCE_BATCH}/report.json" 9
        run_browser_fixture tests/e2e/gym_branding_server.py 8770 tests/e2e/gym_branding.cjs "${browser_evidence}/private-branding-${METODOBASE_EVIDENCE_BATCH}/report.json" 10
        run_browser_fixture tests/e2e/privacy_export_server.py 8768 tests/e2e/privacy_export.cjs "${browser_evidence}/privacy-export-${METODOBASE_EVIDENCE_BATCH}/privacy-export-browser.json" 8
        run_browser_fixture tests/e2e/auth_refresh_server.py 8772 tests/e2e/auth_refresh_browser.cjs "${browser_evidence}/auth-refresh-browser-${METODOBASE_EVIDENCE_BATCH}/report.json" 9
        run_browser_fixture tests/e2e/auth_refresh_server.py 8772 tests/e2e/auth_refresh_storage_browser_review.cjs "${browser_evidence}/auth-refresh-storage-browser-${METODOBASE_EVIDENCE_BATCH}/report.json" 3
        run_browser_fixture tests/e2e/personal_generation_server.py 8773 tests/e2e/personal_generation.cjs "${browser_evidence}/personal-plan-ui-browser-${METODOBASE_EVIDENCE_BATCH}/report.json" 15 named 8
        run_browser_fixture tests/e2e/personal_diary_server.py 8776 tests/e2e/personal_diary.cjs "${browser_evidence}/diary-ui-browser-${METODOBASE_EVIDENCE_BATCH}/report.json" 17 named 8 tests/e2e/personal_export_context_browser.cjs "${browser_evidence}/diary-ui-consumer-fix-browser-${METODOBASE_EVIDENCE_BATCH}/report.json" 4 strings 4 personal-diary-ui
        run_browser_fixture tests/e2e/personal_history_server.py 8780 tests/e2e/personal_history_browser.cjs "docs/implementation/20261018-evolution/evidence/history-pagination/browser-${METODOBASE_EVIDENCE_BATCH}/report.json" 10 strings 4 "" "" 0 strings 0 personal-history-ui
        run_browser_fixture tests/e2e/landing_server.py 8781 tests/e2e/landing.cjs "docs/implementation/20261018-evolution/evidence/landing/browser-${METODOBASE_EVIDENCE_BATCH}/report.json" 8 strings 4 "" "" 0 strings 0 public-landing
        ) > "$RUNNER_TEMP/ci30-image-private/step-13.raw.log" 2>&1
    - name: Real member linking browser with restricted migrated PostgreSQL and private mail transport
      env:
        METODOBASE_TEST_MIGRATOR_URL: postgresql+psycopg2://metodobase_test_admin:synthetic-ci-only@127.0.0.1:55483/metodobase_test_image
        METODOBASE_TEST_POSTGRES_URL: postgresql+psycopg2://metodobase_test_app:synthetic-app-only@127.0.0.1:55483/metodobase_test_image
        METODOBASE_TEST_PG_BIN: /usr/bin
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-image-private"
        (
        export QA_NODE_MODULES="$RUNNER_TEMP/ci30-image/source/tests/e2e/node_modules"
        export QA_CHROME=$(node -e "process.stdout.write(require('./tests/e2e/node_modules/playwright-core').chromium.executablePath())")
        python -X utf8 tests/e2e/run_member_link_browser.py --output "$RUNNER_TEMP/member-link-public" --port 8794
        ) > "$RUNNER_TEMP/ci30-image-private/step-14.raw.log" 2>&1
    - name: Record candidate identity
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-image-private"
        (
        docker image inspect metodobase-ci30:${{ github.sha }} --format '{{.Id}}' > candidate-image-id.txt
        ) > "$RUNNER_TEMP/ci30-image-private/step-15.raw.log" 2>&1
    - name: Stop isolated candidate
      if: always()
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-image-private"
        (
        docker rm --force metodobase-ci30
        ) > "$RUNNER_TEMP/ci30-image-private/step-16.raw.log" 2>&1
    - name: Host checkout follow-up browser uses current restricted PostgreSQL fixture
      timeout-minutes: 5
      env:
        METODOBASE_TEST_MIGRATOR_URL: postgresql+psycopg2://metodobase_test_admin:synthetic-ci-only@127.0.0.1:55483/metodobase_test_image
        METODOBASE_TEST_POSTGRES_URL: postgresql+psycopg2://metodobase_test_app:synthetic-app-only@127.0.0.1:55483/metodobase_test_image
        METODOBASE_TEST_PG_BIN: /usr/bin
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-image-private"
        (
        set -euo pipefail
        private="$RUNNER_TEMP/followup-private"
        public="$RUNNER_TEMP/followup-public"
        mkdir "$private" "$public"
        fixture_pid=""
        finish_followup() {
          status=$?
          trap - EXIT INT TERM
          touch "$private/stop"
          if [ -n "$fixture_pid" ]; then
            for attempt in $(seq 1 100); do
              if ! jobs -pr | grep -qx "$fixture_pid"; then break; fi
              sleep 0.2
            done
            if jobs -pr | grep -qx "$fixture_pid"; then
              echo "Owned follow-up fixture did not finalize" >&2
              status=1
            elif ! wait "$fixture_pid"; then
              status=1
            fi
          fi
          exit "$status"
        }
        trap finish_followup EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        python -c 'import json,os,pathlib; keys=("METODOBASE_TEST_MIGRATOR_URL","METODOBASE_TEST_POSTGRES_URL","METODOBASE_TEST_PG_BIN"); pathlib.Path(os.environ["RUNNER_TEMP"],"followup-private","config.json").write_text(json.dumps({key:os.environ[key] for key in keys}),encoding="utf8")'
        export FOLLOWUP_NODE_MODULES="$RUNNER_TEMP/ci30-image/source/tests/e2e/node_modules"
        export CHROME_PATH=$(node -e "process.stdout.write(require('./tests/e2e/node_modules/playwright-core').chromium.executablePath())")
        python -X utf8 tests/e2e/followup_server.py --pg-config "$private/config.json" --report "$public/startup.json" --stop-file "$private/stop" --port 8795 >"$private/server.stdout.log" 2>"$private/server.stderr.log" &
        fixture_pid=$!
        ready=0
        for attempt in $(seq 1 90); do
          if ! jobs -pr | grep -qx "$fixture_pid"; then break; fi
          if python scripts/check_followup_fixture.py "$public/startup.json" --pid "$fixture_pid" --port 8795 2>/dev/null && curl --fail --silent http://127.0.0.1:8795/health >/dev/null; then ready=1; break; fi
          sleep 1
        done
        test "$ready" = 1
        export FOLLOWUP_STARTUP_REPORT="$public/startup.json"
        node tests/e2e/dashboard_followup_browser.cjs "$public"
        python tests/e2e/normalize_followup_report.py "$public/report.json" "$public/normalized.json" --kind browser --minimum 8
        python scripts/check_frontend_report.py "$public/normalized.json" --format named --minimum 8 --minimum-screens 5
        python scripts/check_followup_fixture.py "$public/startup.json" --pid "$fixture_pid" --port 8795
        ) > "$RUNNER_TEMP/ci30-image-private/step-17.raw.log" 2>&1
    - name: Historical30 labelled browser reports
      if: always()
      working-directory: ${{ github.workspace }}
