  historical-image:
    runs-on: ubuntu-latest
    needs:
    - test-web
    - historical-postgres
    services:
      postgres-image:
        image: postgres:17.11
        env:
          POSTGRES_USER: metodobase_test_admin
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: metodobase_test_image
        ports:
        - 55483:5432
        options: --health-cmd "pg_isready -U metodobase_test_admin -d metodobase_test_image" --health-interval 5s --health-timeout
          5s --health-retries 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Materialize exact accepted CI30 Git blobs; no archive filters or replace refs
      working-directory: ${{ github.workspace }}
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-image-private"
        (
        python -X utf8 tests/run_reviewed_ci30.py --materialize-only --history-repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/ci30-image"
        ) > "$RUNNER_TEMP/ci30-image-private/step-2.raw.log" 2>&1
    - name: Build the production Dockerfile
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-image-private"
        (
        docker build --tag metodobase-ci30:${{ github.sha }} .
        ) > "$RUNNER_TEMP/ci30-image-private/step-3.raw.log" 2>&1
    - name: Migrate the synthetic database using the candidate itself
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-image-private"
        (
        docker run --rm --network host --entrypoint python -e METODOBASE_ENV=testing -e MIGRATOR_DATABASE_URL=postgresql+psycopg2://metodobase_test_admin:synthetic-ci-only@127.0.0.1:55483/metodobase_test_image -e DATABASE_URL=postgresql+psycopg2://metodobase_test_app:synthetic-app-only@127.0.0.1:55483/metodobase_test_image metodobase-ci30:${{ github.sha }} /app/db_bootstrap.py
        ) > "$RUNNER_TEMP/ci30-image-private/step-4.raw.log" 2>&1
    - name: Grant a separate restricted runtime role
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-image-private"
        (
        docker exec ${{ job.services.postgres-image.id }} psql --username=metodobase_test_admin --dbname=metodobase_test_image --set=ON_ERROR_STOP=1 --command "CREATE ROLE metodobase_test_app LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD 'synthetic-app-only'; GRANT USAGE ON SCHEMA public TO metodobase_test_app; GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO metodobase_test_app; GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA public TO metodobase_test_app;"
        ) > "$RUNNER_TEMP/ci30-image-private/step-5.raw.log" 2>&1
    - name: Exercise the same web runtime inside the candidate
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-image-private"
        (
        docker run --detach --name metodobase-ci30 --network host --entrypoint python -e METODOBASE_ENV=testing -e WEB_SECRET_KEY=synthetic-ci-only-secret-at-least-32-characters -e DATABASE_URL=postgresql+psycopg2://metodobase_test_app:synthetic-app-only@127.0.0.1:55483/metodobase_test_image -e METODOBASE_DATA_DIR=/data -e OBJECT_STORAGE_BACKEND=local -e OBJECT_STORAGE_LOCAL_ROOT=/tmp/metodobase-image-objects -e METODOBASE_SEED_DEMO=0 -e PORT=8765 metodobase-ci30:${{ github.sha }} -m uvicorn web.main_web:create_app --factory --host 127.0.0.1 --port 8765
        for attempt in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:8765/health/ready; then exit 0; fi
          sleep 1
        done
        docker logs metodobase-ci30
        exit 1
        ) > "$RUNNER_TEMP/ci30-image-private/step-6.raw.log" 2>&1
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: tests/e2e/package-lock.json
    - name: Reproducible browser tooling and Chromium
      run: |
        install -d -m 700 "$RUNNER_TEMP/ci30-image-private"
