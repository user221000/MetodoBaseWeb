        install -d -m 700 "$RUNNER_TEMP/ci37-pg-launch-private"
        python -B -X utf8 - > "$RUNNER_TEMP/ci37-pg-launch-private/bootstrap.private.log" 2>&1 <<'PY'
        import hashlib,json,os,re,secrets,socket,subprocess
        from datetime import UTC,datetime,timedelta
