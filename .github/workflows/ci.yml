      working-directory: ${{ github.workspace }}
      run: python -X utf8 tests/ci_google33/history.py --schema 31 --history-repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/historical31-web"
    - run: python -m pip install --require-hashes -r requirements-test.lock
    - name: Current MFA31 wiring, exact report nodes and offline trust canaries
      run: python -X utf8 tests/verify_mfa31_ci.py --output "$RUNNER_TEMP/mfa31-ci-wiring"
    - name: SaaS regression suite in fresh isolated data
      run: |
        install -d -m 700 "$RUNNER_TEMP/web-private"
        (
        python -B -X utf8 "$GITHUB_WORKSPACE/tests/ci_web37/run_historical31_web.py" --source "$RUNNER_TEMP/historical31-web/source" --mode serial
        ) > "$RUNNER_TEMP/web-private/step-4.raw.log" 2>&1
    - name: Required SaaS cases cannot silently become skips
      run: python -c "import xml.etree.ElementTree as ET; assert not ET.parse('pytest-web.xml').findall('.//skipped'), 'Required
        SaaS cases were skipped'"
    - name: Private storage SDK parameters and explicit configuration without a provider
      run: |
        install -d -m 700 "$RUNNER_TEMP/web-private"
        (
        python -X utf8 tests/run_isolated.py tests/integration_object_store_configuration.py tests/integration_object_store_configuration_review.py tests/integration_object_storage_sdk.py -q --tb=short --junitxml=pytest-storage-sdk.xml
        ) > "$RUNNER_TEMP/web-private/step-6.raw.log" 2>&1
    - name: Required private storage SDK cases cannot silently become skips
      run: python -c "import xml.etree.ElementTree as ET; assert not ET.parse('pytest-storage-sdk.xml').findall('.//skipped'),
        'Required storage SDK cases were skipped'"
    - name: New nutrition contracts meet reviewed risk coverage
      run: python tests/check_coverage.py coverage.json
    - name: Full SaaS suite in shuffled order and two isolated workers
      run: |
        install -d -m 700 "$RUNNER_TEMP/web-private"
        (
        python -B -X utf8 "$GITHUB_WORKSPACE/tests/ci_web37/run_historical31_web.py" --source "$RUNNER_TEMP/historical31-web/source" --mode parallel
        ) > "$RUNNER_TEMP/web-private/step-9.raw.log" 2>&1
    - name: Required shuffled SaaS cases cannot silently become skips
      run: python -c "import xml.etree.ElementTree as ET; assert not ET.parse('pytest-web-shuffle.xml').findall('.//skipped'),
        'Required shuffled SaaS cases were skipped'"
    - name: Project current web reports without assertion bodies
      if: always()
      working-directory: ${{ runner.temp }}/historical31-web/source
      run: python -X utf8 tests/ci_mfa31/publish.py --directory "$RUNNER_TEMP/historical31-web/source" --output "$RUNNER_TEMP/web-public"
        --files "pytest-web.xml" "pytest-web-shuffle.xml" "pytest-storage-sdk.xml" "coverage.xml" "coverage.json"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: historical31-web-tests-${{ matrix.python }}
        path: |-
          ${{ runner.temp }}/web-public/pytest-web.xml
          ${{ runner.temp }}/web-public/pytest-web-shuffle.xml
          ${{ runner.temp }}/web-public/pytest-storage-sdk.xml
          ${{ runner.temp }}/web-public/coverage.xml
          ${{ runner.temp }}/web-public/coverage.json
          ${{ runner.temp }}/web-public/publication.json
        if-no-files-found: error
    defaults:
      run:
        shell: bash
        working-directory: ${{ runner.temp }}/historical31-web/source
  historical31-wiring:
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Materialize exact version31 Git blobs and detached source context
      working-directory: ${{ github.workspace }}
      run: python -X utf8 tests/ci_google33/history.py --schema 31 --history-repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/historical31-wiring"
    - run: python -m pip install --require-hashes -r requirements-test.lock
      working-directory: ${{ runner.temp }}/historical31-wiring/source
    - name: Original complete CI31 verifier and205 parser/trust controls; source31 only
      working-directory: ${{ runner.temp }}/historical31-wiring/source
      run: python -X utf8 tests/verify_mfa31_ci.py --output "$RUNNER_TEMP/historical31-wiring-review"
  historical32-postgres:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: metodobase_test_admin
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: metodobase_test_integration
        ports:
        - 55482:5432
        options: --health-cmd "pg_isready -U metodobase_test_admin -d metodobase_test_integration" --health-interval 5s --health-timeout
          5s --health-retries 10
    env:
      METODOBASE_TEST_MIGRATOR_URL: postgresql+psycopg2://metodobase_test_admin:synthetic-ci-only@127.0.0.1:55482/metodobase_test_integration
      METODOBASE_TEST_POSTGRES_URL: postgresql+psycopg2://metodobase_test_app:synthetic-app-only@127.0.0.1:55482/metodobase_test_integration
      METODOBASE_TEST_PG_BIN: /usr/lib/postgresql/17/bin
      METODOBASE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/current31-private/evidence
      R24_PG_OUTPUT: ${{ runner.temp }}/current31-private/r24
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Materialize exact version32 Git blobs and detached source context
      working-directory: ${{ github.workspace }}
      run: python -X utf8 tests/ci_google33/history.py --schema 32 --history-repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/historical32-postgres"
    - run: python -m pip install --require-hashes -r requirements-test.lock
    - name: Matching PostgreSQL client tools from the official PGDG repository
      run: |
        . /etc/os-release
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl --fail --silent --show-error --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
        sudo apt-get update
        sudo apt-get install --yes postgresql-client-17
    - name: Historical32 fresh CI role and schema32 bootstrap
      run: python -X utf8 tests/prepare_postgres.py
    - name: Historical32 complete progress/migrations/retirement/populated restore contracts
      working-directory: ${{ github.workspace }}
      run: python -X utf8 tests/ci_google33/run_postgres.py --schema 32 --source "$RUNNER_TEMP/historical32-postgres/source"
        --private "$RUNNER_TEMP/historical32-private" --output "$RUNNER_TEMP/historical32-public"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: historical32-postgres-tests
        path: |-
          ${{ runner.temp }}/historical32-public/pytest-historical32-migrations.xml
          ${{ runner.temp }}/historical32-public/pytest-historical32-migrations.witnesses.json
          ${{ runner.temp }}/historical32-public/pytest-historical32-progress.xml
          ${{ runner.temp }}/historical32-public/pytest-historical32-progress.witnesses.json
          ${{ runner.temp }}/historical32-public/pytest-historical32-adversarial.xml
          ${{ runner.temp }}/historical32-public/pytest-historical32-adversarial.witnesses.json
          ${{ runner.temp }}/historical32-public/pytest-historical32-retirement.xml
          ${{ runner.temp }}/historical32-public/pytest-historical32-retirement.witnesses.json
          ${{ runner.temp }}/historical32-public/pytest-historical32-restore.xml
          ${{ runner.temp }}/historical32-public/pytest-historical32-restore.witnesses.json
          ${{ runner.temp }}/historical32-public/runtime-summary.json
          ${{ runner.temp }}/historical32-public/publication.json
        if-no-files-found: error
    defaults:
      run:
        shell: bash
        working-directory: ${{ runner.temp }}/historical32-postgres/source
'on':
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
