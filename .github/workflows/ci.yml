      run: |
        set -euo pipefail
        install -d -m 700 "$RUNNER_TEMP/ci37-pg-apt-private"
        (
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(dpkg --print-architecture)" = amd64
          key="$RUNNER_TEMP/ci37-pg-apt-private/pgdg.asc"
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc --output "$key"
          fingerprint="$(gpg --batch --show-keys --with-colons "$key" | awk -F: '$1=="fpr" && !found {print $10; found=1}')"
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 644 "$key" /usr/share/keyrings/metodobase-ci37-pgdg.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/metodobase-ci37-pgdg.asc] https://apt-archive.postgresql.org/pub/repos/apt noble-pgdg-archive main' | sudo tee /etc/apt/sources.list.d/metodobase-ci37-pgdg.list
