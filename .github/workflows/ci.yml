        from tests.ci_web37.pg_lease import contract as contract429,digest
        from tests.ci_web37.pg53 import contract as contract53
        from tests.billing13_legacy_apply37_pg_contract import build_contract as contract27,ci_generation
        from tests.ci_web37.pg_plan import phases
        assert os.environ.get('GITHUB_ACTIONS')=='true' and os.name=='posix' and os.geteuid()!=0
        os.umask(0o077)
        root=Path.cwd().resolve();assert root==Path(os.environ['GITHUB_WORKSPACE']).resolve()
        source=source_photo();assert re.fullmatch('[0-9a-f]{40}',os.environ['GITHUB_SHA'])
        assert source['HEAD']==os.environ['GITHUB_SHA']
        pg=Path('/usr/lib/postgresql/17/bin')
        for name in ('postgres','pg_ctl','pg_dump','pg_restore','psql','initdb'):
            version=subprocess.check_output([str(pg/name),'--version'],text=True).split()[2]
            assert version=='17.11'
        with socket.socket() as probe:
            probe.settimeout(1);assert probe.connect_ex(('127.0.0.1',55483))!=0
        private=_private_evidence(Path(os.environ['RUNNER_TEMP'])/'ci37-pg-cluster-private')
        public=Path(os.environ['RUNNER_TEMP'])/'ci37-pg-public';public.mkdir(mode=0o700)
        password=secrets.token_urlsafe(32);app_password=secrets.token_urlsafe(32)
