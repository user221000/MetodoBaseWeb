<section id="mfa-login-panel" class="mfa-view mfa-login-card" aria-labelledby="mfa-login-title" aria-busy="false" hidden>
  <div class="mfa-login-heading">
    <span class="mfa-login-symbol" aria-hidden="true">
      <svg class="mfa-login-symbol-email" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
      <svg class="mfa-login-symbol-factor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 3v6c0 4-5 8-8 9-3-1-8-5-8-9V6l8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
    </span>
    <p class="mfa-login-eyebrow">Un paso más</p>
    <h2 id="mfa-login-title">Verificar acceso</h2>
  </div>
  <p id="mfa-login-status" class="mfa-login-status" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></p>
  <form id="mfa-login-email" class="mfa-login-proof" novalidate hidden>
    <p id="mfa-login-email-target" class="mfa-login-recipient"></p>
    <label class="mfa-login-label" for="mfa-login-email-code">Código de verificación <span>6 cifras</span></label>
    <input id="mfa-login-email-code" class="mfa-login-code-input" type="text" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" pattern="[0-9]{6}" placeholder="······" required spellcheck="false" autocapitalize="off" aria-invalid="false" aria-describedby="mfa-login-email-target mfa-login-email-feedback mfa-login-email-hint">
    <p id="mfa-login-email-feedback" class="mfa-login-feedback" role="alert" aria-atomic="true" hidden></p>
    <p id="mfa-login-email-hint" class="mfa-login-hint">Puedes pegar el código completo. Revisa Spam si no lo ves.</p>
    <button id="mfa-login-email-submit" class="mfa-login-primary" type="submit">Confirmar y continuar</button>
  </form>
  <form id="mfa-login-factor" class="mfa-login-proof" hidden>
    <label class="mfa-login-label" for="mfa-login-method">Método de verificación</label>
    <select id="mfa-login-method"><option value="totp">Aplicación autenticadora</option><option value="recovery_code">Código de recuperación</option></select>
    <label id="mfa-login-code-label" class="mfa-login-label" for="mfa-login-code">Código de tu autenticador
      <input id="mfa-login-code" class="mfa-login-code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" spellcheck="false" aria-describedby="mfa-login-status">
    </label>
    <label id="mfa-login-recovery-label" class="mfa-login-label" for="mfa-login-recovery" hidden>Código de recuperación sin usar
      <input id="mfa-login-recovery" type="text" autocomplete="off" maxlength="22" spellcheck="false" autocapitalize="none" aria-describedby="mfa-login-status">
    </label>
    <button class="mfa-login-primary" type="submit">Verificar y entrar</button>
    <p class="mfa-login-hint">Los códigos de recuperación sólo se pueden usar una vez.</p>
  </form>
  <div class="mfa-login-actions">
    <button class="mfa-login-secondary" type="button" id="mfa-login-cancel">Usar otra cuenta</button>
    <button class="mfa-login-secondary" type="button" id="mfa-login-reopen">Empezar de nuevo</button>
    <button class="mfa-login-secondary" type="button" id="mfa-login-destination" hidden>Continuar a mi cuenta</button>
  </div>
</section>
<p id="mfa-login-google-help" hidden>
  Si necesitas otro acceso, puedes <a href="/auth/reset-password">recuperar tu cuenta</a>.
  Desde una sesión confirmada puedes consultar <a href="/cuenta/google">tus vínculos de Google</a>.
</p>
