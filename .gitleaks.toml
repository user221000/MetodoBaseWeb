        '''^\s*"docs/implementation/20261018-evolution/evidence/pytest-r04-token-before\.log"\s*:\s*"52ad42c020d48688c078f9e1cd68a3df60830dcad175519dc8ad81cccd1cd4d0",?\s*$''',
