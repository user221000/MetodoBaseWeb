title = "MetodoBase candidate secret scan"

[extend]
useDefault = true

# No directory-wide test/doc exceptions. Any finding needs an individual
# review with evidence; a filename alone does not prove a token is synthetic.

[[rules]]
id = "generic-api-key"
    [[rules.allowlists]]
    description = "SHA256 file fingerprints in reviewed execution evidence, never arbitrary JSON values"
    condition = "AND"
    paths = ['''(?:^|/)docs/implementation/20261018-evolution/evidence/(?:[^/]*-source(?:-(?:before|after))?|[^/]*-hashes|secrets-tree-(?:initial|triaged|final)|ux/(?:subscription-independent-source|frontend-freeze-source|frontend-independent-source|team-followup-freeze-source))\.json$''']
    regexTarget = "line"
    regexes = ['''^\s*"[^"\r\n]+\.(?:py|js|html|css|txt|lock|toml|yml|ini|json)"\s*:\s*"[a-f0-9]{64}",?\s*$''']

    [[rules.allowlists]]
    description = "Two literal CSRF test-only strings; no production values"
    condition = "AND"
    paths = ['''(?:^|/)tests/test_csrf_middleware\.py$''']
    regexTarget = "secret"
    regexes = ['''^(?:test_secret_key_at_least_32_characters_long|this_is_a_valid_secret_key_32_chars_plus)$''']

    [[rules.allowlists]]
    description = "Exact public SHA256 of the historical auth review, verified LF and CRLF bytes"
    condition = "AND"
    paths = ['''(?:^|/)docs/implementation/20261018-evolution/evidence/(?:secrets-tree-final|secrets-checkpoint-source)\.json$''']
    regexTarget = "line"
    regexes = ['''^\s*"docs/implementation/20261018-evolution/evidence/backend-auth-review\.md"\s*:\s*"(?:23b64c78dfd83504804132d37d1a331cd4da81eddbfe3129c18a438d72b2a0e7|8773f2e2a9b4cf567bc76f138965d605cf89a21632dcd78379fcbc6f1e42a69f)",?\s*$''']

[[rules]]
id = "sentry-access-token"
    [[rules.allowlists]]
    description = "SHA256 fingerprints of Sentry source files, not access tokens"
    condition = "AND"
    paths = ['''(?:^|/)docs/implementation/20261018-evolution/evidence/(?:[^/]*-source(?:-(?:before|after))?|[^/]*-hashes|secrets-tree-(?:initial|triaged|final))\.json$''']
    regexTarget = "line"
    regexes = ['''^\s*"[^"\r\n]+\.py"\s*:\s*"[a-f0-9]{64}",?\s*$''']

    [[rules.allowlists]]
    description = "Exact public SHA256 of the immutable historical Sentry pytest log in the prior scan report"
    condition = "AND"
    paths = ['''(?:^|/)docs/implementation/20261018-evolution/evidence/(?:secrets-tree-final|secrets-checkpoint-source)\.json$''']
    regexTarget = "line"
    regexes = ['''^\s*"docs/audit/2026-10-18/qa/pytest-sentry-isolated\.log"\s*:\s*"7fc244c5d3e786c4655655556dafc26602b4a45f1829bc7c31f6825d461cfb68",?\s*$''']
